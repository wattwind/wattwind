<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Segoe UI, system-ui, Arial, sans-serif" font-size="15" role="img" aria-label="A bike on a smart trainer with three fans seen from above: a front fan with the WattWind leader, a side fan and a fan from above as followers, each blowing at its own level">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #d6dad2; stroke-width: 1.5; }
      .floor { fill: #f6f7f4; }
      .h { font-weight: 600; fill: #1b1d21; }
      .t { fill: #1b1d21; }
      .s { font-size: 13px; fill: #5a6068; }
      .acc { fill: #1f7a4d; font-weight: 600; }
      .cage { fill: #eef1ec; stroke: #1b1d21; stroke-width: 2.5; }
      .blade { fill: #9aa39a; }
      .hub { fill: #1b1d21; }
      .air { fill: none; stroke: #7fb3e6; stroke-width: 3; stroke-linecap: round; }
      .ww { fill: #dcefe4; stroke: #1f7a4d; stroke-width: 2; }
      .wwt { font-size: 12px; font-weight: 600; fill: #1f7a4d; }
      .ble { fill: none; stroke: #1f6feb; stroke-width: 2; stroke-dasharray: 6 5; }
      .wifi { fill: none; stroke: #1f7a4d; stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; }
      .lvl { font-size: 24px; font-weight: 700; fill: #1b1d21; }
    </style>
    <marker id="air" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7fb3e6"/>
    </marker>
    <g id="fan">
      <circle r="52" class="cage"/>
      <path class="blade" d="M0 0 C 10 -14 30 -30 34 -12 C 36 -2 14 2 0 0 Z"/>
      <path class="blade" d="M0 0 C 10 -14 30 -30 34 -12 C 36 -2 14 2 0 0 Z" transform="rotate(120)"/>
      <path class="blade" d="M0 0 C 10 -14 30 -30 34 -12 C 36 -2 14 2 0 0 Z" transform="rotate(240)"/>
      <circle r="8" class="hub"/>
      <circle r="52" fill="none" stroke="#1b1d21" stroke-width="1" stroke-dasharray="2 5"/>
    </g>
  </defs>
  <rect x="1" y="1" width="998" height="558" rx="14" class="card"/>
  <rect x="20" y="20" width="640" height="520" rx="10" class="floor"/>
  <text x="36" y="48" class="h">One bike, three fans (seen from above)</text>

  <!-- bike on the trainer (seen from above, front to the left) -->
  <rect x="548" y="262" width="104" height="56" rx="8" fill="#cfd5cc" stroke="#1b1d21" stroke-width="1.5"/>
  <text x="600" y="342" text-anchor="middle" class="s">smart trainer</text>
  <rect x="584" y="287" width="62" height="6" rx="3" fill="#6b7280"/>
  <rect x="300" y="286" width="84" height="8" rx="4" fill="#1b1d21"/>
  <line x1="342" y1="290" x2="590" y2="290" stroke="#1b1d21" stroke-width="5" stroke-linecap="round"/>
  <line x1="360" y1="252" x2="360" y2="328" stroke="#1b1d21" stroke-width="5" stroke-linecap="round"/>
  <path d="M360 252 q -14 0 -16 10 M360 328 q -14 0 -16 -10" fill="none" stroke="#1b1d21" stroke-width="5" stroke-linecap="round"/>
  <path d="M528 284 L 552 282 Q 560 290 552 298 L 528 296 Q 522 290 528 284 Z" fill="#1b1d21"/>
  <line x1="490" y1="270" x2="490" y2="310" stroke="#1b1d21" stroke-width="4" stroke-linecap="round"/>
  <rect x="482" y="260" width="16" height="9" rx="2" fill="#6b7280"/>
  <rect x="482" y="311" width="16" height="9" rx="2" fill="#6b7280"/>
  <!-- heart-rate strap -->
  <path d="M300 148 c -6 -9 -18 -3 -12 6 l 12 10 l 12 -10 c 6 -9 -6 -15 -12 -6 z" fill="#d62828"/>
  <text x="320" y="158" class="s">HR strap</text>

  <!-- front fan: the leader -->
  <g transform="translate(150,290)"><use href="#fan"/></g>
  <path class="air" d="M214 262 C 250 250 280 262 312 258" marker-end="url(#air)"/>
  <path class="air" d="M214 290 C 250 278 280 298 316 290" marker-end="url(#air)"/>
  <path class="air" d="M214 318 C 250 330 280 316 312 322" marker-end="url(#air)"/>
  <rect x="96" y="372" width="108" height="40" rx="8" class="ww"/>
  <text x="150" y="391" text-anchor="middle" class="wwt">WattWind</text>
  <text x="150" y="405" text-anchor="middle" class="wwt">leader</text>
  <line x1="150" y1="342" x2="150" y2="372" stroke="#1b1d21" stroke-width="2"/>
  <text x="150" y="222" text-anchor="middle" class="h">front fan: level 3</text>

  <!-- right-hand side fan (top of the picture): follower, own settings -->
  <g transform="translate(470,120)"><use href="#fan"/></g>
  <path class="air" d="M440 178 C 430 200 446 220 440 244" marker-end="url(#air)"/>
  <path class="air" d="M470 178 C 460 205 480 222 470 248" marker-end="url(#air)"/>
  <path class="air" d="M500 178 C 492 200 508 220 500 244" marker-end="url(#air)"/>
  <rect x="560" y="80" width="88" height="40" rx="8" class="ww"/>
  <text x="604" y="99" text-anchor="middle" class="wwt">WattWind</text>
  <text x="604" y="113" text-anchor="middle" class="wwt">follower</text>
  <line x1="522" y1="110" x2="560" y2="105" stroke="#1b1d21" stroke-width="2"/>
  <text x="400" y="100" text-anchor="end" class="h">right side fan: level 1</text>

  <!-- side fan (bottom of the picture): follower, one lower -->
  <g transform="translate(470,460)"><use href="#fan"/></g>
  <path class="air" d="M440 402 C 430 380 446 360 440 336" marker-end="url(#air)"/>
  <path class="air" d="M470 402 C 460 375 480 358 470 332" marker-end="url(#air)"/>
  <path class="air" d="M500 402 C 492 380 508 360 500 336" marker-end="url(#air)"/>
  <rect x="560" y="460" width="88" height="40" rx="8" class="ww"/>
  <text x="604" y="479" text-anchor="middle" class="wwt">WattWind</text>
  <text x="604" y="493" text-anchor="middle" class="wwt">follower</text>
  <line x1="522" y1="470" x2="560" y2="476" stroke="#1b1d21" stroke-width="2"/>
  <text x="400" y="486" text-anchor="end" class="h">left side fan: level 2</text>

  <!-- connections -->
  <path class="ble" d="M300 168 C 262 230 246 330 210 388"/>
  <path class="ble" d="M560 318 C 470 420 300 420 204 404"/>
  <text x="246" y="430" class="s" fill="#1f6feb">Bluetooth</text>
  <path class="wifi" d="M96 386 C 30 330 30 150 90 100 S 220 30 330 30 L 604 30 L 604 80"/>
  <path class="wifi" d="M150 412 L 150 528 L 604 528 L 604 500"/>
  <text x="44" y="250" class="acc" font-size="13">Wi-Fi</text>
  <text x="158" y="470" class="acc" font-size="13">Wi-Fi</text>

  <!-- legend -->
  <text x="690" y="70" class="h">Front fan · leader</text>
  <text x="690" y="92" class="t">Reads the strap and the trainer,</text>
  <text x="690" y="112" class="t">follows your effort in Auto.</text>
  <text x="690" y="132" class="s">Now at level 3: a hard interval.</text>

  <text x="690" y="186" class="h">Left side fan · follower, one lower</text>
  <text x="690" y="208" class="t">Same as the leader, one level</text>
  <text x="690" y="228" class="t">gentler: a breeze from the side.</text>

  <text x="690" y="282" class="h">Right side fan · own settings</text>
  <text x="690" y="304" class="t">Gets your heart rate and power,</text>
  <text x="690" y="324" class="t">decides itself: here it only comes</text>
  <text x="690" y="344" class="t">on at hard efforts.</text>

  <line x1="690" y1="380" x2="976" y2="380" stroke="#d6dad2" stroke-width="1.5"/>
  <text x="690" y="408" class="t">Only the leader uses Bluetooth, so</text>
  <text x="690" y="428" class="t">your training app keeps its own</text>
  <text x="690" y="448" class="t">connection to the sensors.</text>
  <text x="690" y="482" class="s">Any number of followers; all fans on</text>
  <text x="690" y="500" class="s">the same home network.</text>
</svg>
